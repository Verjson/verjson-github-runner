name: image build check

# publish-images.yml pushes :base/:latest to GHCR the moment a change lands on main, so a
# broken image change (bad base codename, renamed apt package, checksum drift) is only
# discovered once it is already the tag hosts pull. This builds the images on the pull
# request instead. Build-only: nothing is pushed, so no registry credential is needed and
# no tag is touched.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - images/**
      - entrypoint.sh
      - .github/workflows/image-build-check.yml
  # The PR leg is amd64 only, so arm64-specific breakage — a stale GH_SHA256_ARM64 or
  # NODE_SHA256_ARM64 after an upstream re-release, an arm64-only package gap — still
  # reaches main unseen. The arm64 build is emulated and slow, too slow to put in front
  # of every PR, so it runs on a schedule and on demand instead.
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC — off the top of the hour, off working hours
  workflow_dispatch:

concurrency:
  # github.ref alone is not distinguishing here: schedule and workflow_dispatch both resolve
  # to refs/heads/main, so an on-demand arm64 run and the weekly cron would cancel each other.
  # Keying on the event too keeps each trigger in its own lane.
  group: image-build-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The amd64 legs answer "did this PR break the build?", so they stay on pull_request only:
  # on a schedule they would re-prove what publish-images.yml already builds natively on
  # every push to main, and the cron exists purely for the arm64 gap below.
  base-and-kinds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Plain `docker build` rather than docker/build-push-action: it uses the default
      # buildx builder, which writes results into the local daemon image store, so the
      # kind images below resolve `FROM gha-runner:pr-check-base` with no registry in
      # the loop. amd64 only — a PR check catches source breakage, not arch drift; the
      # multi-arch build stays in publish-images.yml.
      - name: Build base image
        run: |
          docker build --platform linux/amd64 \
            -f images/base.Dockerfile -t gha-runner:pr-check-base .
      # Kinds are built on the base from this same commit, matching how publish-images.yml
      # wires BASE_IMAGE, so a base change that breaks a kind fails here too.
      - name: Build kind images on the just-built base
        run: |
          for kind in rust node python go; do
            docker build --platform linux/amd64 \
              -f "images/${kind}.Dockerfile" \
              --build-arg "BASE_IMAGE=gha-runner:pr-check-base" \
              -t "gha-runner:pr-check-${kind}" .
          done

  root:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The root Dockerfile has its own FROM and pins, independent of images/base.Dockerfile,
      # so it can break on its own and is built in parallel.
      - name: Build root Dockerfile
        run: docker build --platform linux/amd64 -f Dockerfile -t gha-runner:pr-check-root .

  # Weekly/on-demand arm64 build of the base image only. Everything arch-specific lives in
  # images/base.Dockerfile (the per-arch gh and Node checksums); the kind images add no
  # per-arch pins of their own, so building the base is what closes the gap, and skipping
  # the kinds keeps an emulated run to one image. Build-only, nothing pushed.
  base-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same QEMU pin as publish-images.yml, which is where the arm64 build otherwise runs.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Build base image for arm64 under emulation
        run: |
          docker build --platform linux/arm64 \
            -f images/base.Dockerfile -t gha-runner:cron-check-base-arm64 .
