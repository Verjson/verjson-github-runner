name: image build check

# publish-images.yml pushes :base/:latest to GHCR the moment a change lands on main, so a
# broken image change (bad base codename, renamed apt package, checksum drift) is only
# discovered once it is already the tag hosts pull. This builds the images on the pull
# request instead. Build-only: nothing is pushed, so no registry credential is needed and
# no tag is touched.
on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.pwsh
      - docker-bake.hcl
      - images/**
      - entrypoint.sh
      - .github/workflows/image-build-check.yml
      - .github/workflows/publish-images.yml
  # The PR leg is amd64 only, so arm64-specific breakage — a stale GH_SHA256_ARM64 or
  # NODE_SHA256_ARM64 after an upstream re-release, an arm64-only package gap — still
  # reaches main unseen. The arm64 build is emulated and slow, too slow to put in front
  # of every PR, so it runs on a schedule and on demand instead.
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC — off the top of the hour, off working hours
  workflow_dispatch:

concurrency:
  # github.ref alone is not distinguishing here: schedule and workflow_dispatch both resolve
  # to refs/heads/main, so an on-demand arm64 run and the weekly cron would cancel each other.
  # Keying on the event too keeps each trigger in its own lane.
  group: image-build-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The amd64 legs answer "did this PR break the build?", so they stay on pull_request only:
  # on a schedule they would re-prove what publish-images.yml already builds natively on
  # every push to main, and the cron exists purely for the arm64 gap below.
  base-and-kinds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The gha cache exporter only works on buildx's docker-container driver, so the
      # builds below run through docker-bake.hcl, which wires each variant's BASE_IMAGE to
      # the base target rather than to a tag in the local daemon image store that this
      # driver cannot see. amd64 only — a PR check catches source breakage, not arch
      # drift; the multi-arch build stays in publish-images.yml.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # One bake solve: the base is built once and the five variants that sit on it fan out
      # concurrently, each still resolving BASE_IMAGE to that same-run base the way
      # publish-images.yml wires it, so a base change that breaks a variant fails here too.
      - name: Build the base image and every variant on it
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          # Pull requests inherit main's cache. Exporting the same layers here creates a
          # branch-scoped copy that survives the merge: one PR retained 4.25 GB beside
          # main's 6.40 GB cache and pushed the repository over its 10 GB quota.
          CACHE_WRITE: "off"
        with:
          files: docker-bake.hcl
          source: .
          targets: pr-check

  root:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # The root Dockerfile has its own FROM and pins, independent of images/base.Dockerfile,
      # so it can break on its own and is built in parallel.
      - name: Build root Dockerfile
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          # Keep this build read-through only for the same branch-isolation reason as the
          # grouped image build above.
          CACHE_WRITE: "off"
        with:
          files: docker-bake.hcl
          source: .
          targets: root
  # Weekly/on-demand arm64 builds cover every architecture-specific pin: gh and Node in
  # the base plus PowerShell in its thin variant. Other kinds add no per-arch pins.
  base-and-pwsh-arm64:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Same QEMU pin as publish-images.yml, which is where the arm64 build otherwise runs.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build the base image and the pwsh variant for arm64 under emulation
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          PLATFORM: linux/arm64
          # Cold on purpose. This job catches drift a cache key cannot see — an upstream
          # re-release under an unchanged version, or an arm64-only package gap — where the
          # Dockerfile is byte-identical. Reading the cache would turn the
          # `curl | sha256sum -c` layer into a hit, so the checksum this job exists to
          # verify would never re-run. Writing it would also clobber the amd64 index that
          # publish-images.yml maintains in the same scope on refs/heads/main.
          CACHE_READ: "off"
          CACHE_WRITE: "off"
        with:
          files: docker-bake.hcl
          source: .
          targets: arch-check
