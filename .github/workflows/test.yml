name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shell test suites
        run: |
          bash tests/entrypoint_test.sh
          bash tests/ephemeral_mode_test.sh
          bash tests/entrypoint_lifecycle_test.sh
          bash tests/runner_supervision_test.sh
          bash tests/launcher_policy_test.sh

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
      - name: Run Go unit and Docker lifecycle integration tests
        run: cd app && go test ./...
