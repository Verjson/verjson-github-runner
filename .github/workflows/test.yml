name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run entrypoint unit test suite
        run: bash tests/entrypoint_test.sh
      - name: Validate PowerShell setup architecture labels
        run: bash tests/setup_powershell_source_test.sh
      - name: Validate canonical container lifecycle configuration
        run: bash tests/container_release_workflow_test.sh
      - name: Canonical container candidate contract holds
        run: bash scripts/container-candidate-contract.test.sh
      - name: Canonical container release contract holds
        run: bash scripts/container-release-contract.test.sh
      - name: Validate pull request image build check contract
        run: bash tests/image_build_check_workflow_test.sh
      - name: Validate read-only cache inventory measurement
        run: bash tests/cache_inventory_test.sh
      - name: Validate fail-closed GHCR retention policy
        run: |
          python3 tests/ghcr_retention_test.py
          bash tests/ghcr_retention_workflow_test.sh
      - name: Validate verified changelog tooling cache
        run: bash tests/changelog_tool_cache_test.sh
      - name: Prove ephemeral jobs receive fresh writable layers
        run: bash tests/ephemeral_supervisor_integration.sh
      - name: Prove concurrent runners cannot share one work root
        run: bash tests/work_root_isolation_test.sh
      - name: Canonical changelog contract holds
        run: bash scripts/changelog-contract.test.sh
      - name: Canonical CI credentials are organization-neutral
        run: bash tests/neutral_ci_credentials_test.sh

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - name: Run Go unit tests
        run: cd app && go test ./...
