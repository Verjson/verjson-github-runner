name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run entrypoint unit test suite
        run: bash tests/entrypoint_test.sh
      - name: Prove ephemeral jobs receive fresh writable layers
        run: bash tests/ephemeral_supervisor_integration.sh

  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
      - name: Run Go unit tests
        run: cd app && go test ./...
