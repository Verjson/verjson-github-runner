name: publish runner images

# Build the runner images and push them to GHCR so hosts (physical/VPS via the `gha`
# manager, or a GCP VM/MIG via `verjson cloud runner --image`) pull a prebuilt image
# instead of building locally. Multi-arch (amd64 + arm64, arm64 via QEMU emulation).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/verjson/gha-runner
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  base:
    runs-on: [self-hosted, docker]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Every build publishes immutable sha tags and stable tags (:base, :latest, :<kind>)
          # on push to main and tagged releases. Tagged releases also publish release version tags.
          tags: |
            ${{ env.IMAGE }}:base-${{ github.sha }}
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:base-{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Record immutable base image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:base-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > image-digests/base.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-base-${{ github.sha }}
          path: image-digests/base.txt
          if-no-files-found: error

  kinds:
    needs: base
    runs-on: [self-hosted, docker]
    strategy:
      fail-fast: false
      matrix:
        kind: [rust, node, python, go]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.kind }}.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Kinds build FROM the base we just pushed; pin the immutable sha tag so a
          # kind is always built on the exact base from the same commit.
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.kind }}-${{ github.sha }}
            ${{ env.IMAGE }}:${{ matrix.kind }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}-{2}', env.IMAGE, matrix.kind, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Record immutable kind image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
        run: |
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:${KIND}-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > "image-digests/${KIND}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.kind }}-${{ github.sha }}
          path: image-digests/${{ matrix.kind }}.txt
          if-no-files-found: error
