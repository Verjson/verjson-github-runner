name: publish runner images

# Build the runner images and push them to GHCR so hosts (physical/VPS via the `gha`
# manager, or a GCP VM/MIG via `verjson cloud runner --image`) pull a prebuilt image
# instead of building locally. Multi-arch (amd64 + arm64, arm64 via QEMU emulation).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/verjson/gha-runner
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  base:
    # This repository is public. Even trusted main/tag publication stays off the
    # persistent organization runner group so public access can be denied there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/base.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Every build publishes commit-addressed sha tags and stable tags (:base, :latest, :<kind>)
          # on push to main and tagged releases. Tagged releases also publish release version tags.
          tags: |
            ${{ env.IMAGE }}:base-${{ github.sha }}
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:base-{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Record immutable base image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build output is not a valid sha256 image digest." >&2
            exit 1
          fi
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:base-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > image-digests/base.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-base-${{ github.sha }}
          path: image-digests/base.txt
          if-no-files-found: error

  kinds:
    needs: base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [rust, node, python, go]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/${{ matrix.kind }}.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Kinds build FROM the base we just pushed; use the commit-addressed sha tag so a
          # kind is always built on the exact base from the same commit.
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.kind }}-${{ github.sha }}
            ${{ env.IMAGE }}:${{ matrix.kind }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}-{2}', env.IMAGE, matrix.kind, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Record immutable kind image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build output is not a valid sha256 image digest." >&2
            exit 1
          fi
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:${KIND}-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > "image-digests/${KIND}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.kind }}-${{ github.sha }}
          path: image-digests/${{ matrix.kind }}.txt
          if-no-files-found: error
