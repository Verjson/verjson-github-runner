name: publish runner images

# Build the runner images and push them to GHCR so hosts (physical/VPS via the `gha`
# manager, or a GCP VM/MIG via `verjson cloud runner --image`) pull a prebuilt image
# instead of building locally. Multi-arch (amd64 + arm64, arm64 via QEMU emulation).
on:
  push:
    branches: [main]

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE: ghcr.io/verjson/gha-runner
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  base:
    # This repository is public. Trusted main publication stays off the
    # persistent organization runner group so public access can be denied there.
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: images/base.Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Every main build publishes commit-addressed sha tags and stable tags
          # (:base, :latest, :<kind>).
          tags: |
            ${{ env.IMAGE }}:base-${{ github.sha }}
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest base image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record immutable base image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build output is not a valid sha256 image digest." >&2
            exit 1
          fi
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:base-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > image-digests/base.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-base-${{ github.sha }}
          path: image-digests/base.txt
          if-no-files-found: error

  kinds:
    needs: base
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: rust
            dockerfile: images/rust.Dockerfile
          - kind: node
            dockerfile: images/node.Dockerfile
          - kind: python
            dockerfile: images/python.Dockerfile
          - kind: go
            dockerfile: images/go.Dockerfile
          - kind: pwsh
            dockerfile: Dockerfile.pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          # Bind every variant to the exact multi-arch base manifest produced above. A tag,
          # even a commit-addressed one, remains mutable in the registry.
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ needs.base.outputs.digest }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.kind }}-${{ github.sha }}
            ${{ env.IMAGE }}:${{ matrix.kind }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest kind image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record immutable kind image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KIND: ${{ matrix.kind }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build output is not a valid sha256 image digest." >&2
            exit 1
          fi
          mkdir -p image-digests
          printf 'source=%s\ncommit=%s\nimage=%s\nplatforms=%s\ndigest=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" \
            "${IMAGE}:${KIND}-${GITHUB_SHA}" "${PLATFORMS}" "${DIGEST}" \
            > "image-digests/${KIND}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.kind }}-${{ github.sha }}
          path: image-digests/${{ matrix.kind }}.txt
          if-no-files-found: error
