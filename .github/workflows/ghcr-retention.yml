name: GHCR retention

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Build a dry-run plan or request the separately gated deletion job
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - delete
      confirm:
        description: For delete mode only, enter DELETE ghcr.io/verjson/gha-runner
        required: false
        type: string

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      plan-sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build fail-closed retention plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_PROTECTED_DIGESTS: ${{ vars.GHCR_PROTECTED_DIGESTS }}
        run: |
          python3 scripts/ghcr_retention.py plan --output ghcr-retention-plan.json
          printf 'sha256=%s\n' "$(jq -r .plan_sha256 ghcr-retention-plan.json)" >>"$GITHUB_OUTPUT"
          {
            printf '## GHCR retention dry run\n\n'
            jq -r '"- Plan: `" + .plan_sha256 + "`\n- Versions: " + (.counts.versions|tostring) + "\n- Referenced untagged dependencies: " + (.counts.reachable_untagged_dependencies|tostring) + "\n- Protected untagged deployment/rollback roots: " + (.counts.protected_untagged_deployment_or_rollback_roots|tostring) + "\n- Unreachable untagged versions: " + (.counts.unreachable_untagged|tostring) + "\n- Candidates: " + (.counts.candidates|tostring) + "\n- This batch: " + (.counts.delete_batch|tostring) + "\n- Deletion eligible: " + (.eligible_for_apply|tostring)' ghcr-retention-plan.json
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload auditable dry-run plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-retention-plan-${{ github.run_id }}
          path: ghcr-retention-plan.json
          if-no-files-found: error
          retention-days: 90

  delete:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'delete'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ghcr-retention-deletion
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require repository policy and exact package confirmation
        env:
          ENABLED_POLICY: ${{ vars.GHCR_RETENTION_DELETE_ENABLED }}
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          [[ "$ENABLED_POLICY" == 'ghcr-retention-v1' ]] || {
            echo '::error::GHCR_RETENTION_DELETE_ENABLED is not ghcr-retention-v1.' >&2
            exit 1
          }
          [[ "$CONFIRMATION" == 'DELETE ghcr.io/verjson/gha-runner' ]] || {
            echo '::error::Exact package confirmation was not supplied.' >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghcr-retention-plan-${{ github.run_id }}
      - name: Revalidate and apply the reviewed plan
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_PROTECTED_DIGESTS: ${{ vars.GHCR_PROTECTED_DIGESTS }}
          AUTHORIZATION: ${{ vars.GHCR_RETENTION_DELETE_ENABLED }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}
        run: |
          python3 scripts/ghcr_retention.py apply \
            --plan ghcr-retention-plan.json \
            --confirm-plan-sha256 "$PLAN_SHA256" \
            --authorization "$AUTHORIZATION" \
            --receipt-output ghcr-retention-receipt.json
      - name: Upload deletion receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-retention-receipt-${{ github.run_id }}
          path: ghcr-retention-receipt.json
          if-no-files-found: warn
          retention-days: 90
