name: GHCR retention inventory

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build fail-closed retention plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ghcr_retention.py plan --output ghcr-retention-plan.json
          {
            printf '## GHCR retention dry run\n\n'
            jq -r '"- Plan: `" + .plan_sha256 + "`\n- Versions: " + (.counts.versions|tostring) + "\n- Referenced untagged dependencies: " + (.counts.reachable_untagged_dependencies|tostring) + "\n- Unreachable untagged versions: " + (.counts.unreachable_untagged|tostring) + "\n- Provisional policy candidates: " + (.counts.candidates|tostring) + "\n- Pruning authorized: " + (.pruning_authorized|tostring)' ghcr-retention-plan.json
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload auditable dry-run plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-retention-plan-${{ github.run_id }}
          path: ghcr-retention-plan.json
          if-no-files-found: error
          retention-days: 90
