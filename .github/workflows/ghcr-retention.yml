name: GHCR retention inventory

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Snapshot GitHub evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ghcr_retention.py inventory --output ghcr-package-inventory.json
          python3 scripts/ghcr_retention.py prior-evidence \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --current-run-id "$GITHUB_RUN_ID" \
            --expected-output ghcr-expected-prior.json \
            --evidence-output ghcr-prior-evidence.json
      - name: Build fail-closed retention plan
        run: |
          python3 scripts/ghcr_retention.py plan \
            --inventory ghcr-package-inventory.json \
            --prior-evidence ghcr-prior-evidence.json \
            --expected-prior ghcr-expected-prior.json \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --output ghcr-retention-plan.json
          {
            printf '## GHCR retention dry run\n\n'
            jq -r '"- Plan: `" + .plan_sha256 + "`\n- Observation chain: " + .observation_chain.status + "\n- Versions: " + (.counts.versions|tostring) + "\n- Referenced untagged dependencies: " + (.counts.reachable_untagged_dependencies|tostring) + "\n- Unreachable untagged versions: " + (.counts.unreachable_untagged|tostring) + "\n- Provisional policy candidates: " + (.counts.candidates|tostring) + "\n- Pruning authorized: " + (.pruning_authorized|tostring)' ghcr-retention-plan.json
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload auditable dry-run plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-retention-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ghcr-retention-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Build held deletion preview
        run: |
          python3 scripts/ghcr_retention.py preview \
            --plan ghcr-retention-plan.json \
            --output ghcr-retention-preview.json
          {
            printf '\n## Held deletion preview\n\n'
            jq -r '"- Preview: `" + .preview_sha256 + "`\n- Dry run: " + (.dry_run|tostring) + "\n- Deletion authorized: " + (.deletion_authorized|tostring) + "\n- Held requests: " + (.delete_requests|length|tostring)' ghcr-retention-preview.json
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload held deletion preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-retention-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ghcr-retention-preview.json
          if-no-files-found: error
          retention-days: 90
